name: claude_48_ai
description: "KiKai — Multi-model AI chat companion."
publish_to: "none"
version: 0.15.0+22

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.2
  dio: ^5.7.0

  # UI
  flutter_markdown: ^0.7.4+3
  markdown: ^7.2.2
  flutter_highlight: ^0.7.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0

  # Media & file (attachment support — M4)
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  mime: ^1.0.6

  # Local storage (history — M2)
  shared_preferences: ^2.3.3
  sqflite: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # M7 — Backend (Firebase + GAS auth + native bridge)
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  crypto: ^3.0.5
  url_launcher: ^6.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # M16 — Firebase OAuth (Google + Facebook) sign-in
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1

  # M24 — AdMob
  google_mobile_ads: ^5.1.0

  # Utility
  intl: ^0.19.0
  uuid: ^4.5.1

  # M40 — Export laporan riset ke PDF
  pdf: ^3.11.1
  printing: ^5.13.4



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/mascot/
    - assets/models/
    - assets/donation/
    - assets/dataset/
    - assets/dataset/Universal/
    - assets/dataset/Universal/dataset/
    - assets/dataset/Universal/dataset/identity/
    - assets/dataset/Universal/dataset/interaction/
    - assets/dataset/dataset/
    - assets/dataset/dataset/ringan/
    - assets/dataset/dataset/ringan/identity/
    - assets/dataset/casual-vibe/
    - assets/dataset/casual-vibe/identity/
    - assets/dataset/security/
    - assets/dataset/security/identity/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B14"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
