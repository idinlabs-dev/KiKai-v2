name: Generate Release Keystore (one-time, permanent)

# Bro ini workflow SEKALI PAKAI (manual dispatch). Fungsinya:
#   1. Generate release keystore (RSA 2048, valid 100 tahun) di runner CI.
#   2. Auto-set 4 GitHub Secret (ANDROID_KEYSTORE_BASE64 + 3 password) via PAT.
#   3. Print SHA-1 & SHA-256 ke Job Summary → lo copy ke Firebase Console.
#   4. Upload keystore ter-encrypt (7z, password dari input) sebagai artifact
#      → backup wajib ke Google Drive / password manager lo.
#
# Prasyarat 1x doang (dari HP juga bisa via github.com):
#   - Bikin Personal Access Token (classic, scope `repo`) di
#     https://github.com/settings/tokens → Generate → copy.
#   - Repo lo → Settings → Secrets and variables → Actions → New repository
#     secret → name `GH_PAT`, value = token tadi.
#
# Setelah workflow ini sukses SEKALI, DELETE workflow file ini biar nggak
# ke-trigger ulang (atau biarin — ada guard `refuse-if-exists`).

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias (default: claude-release)"
        required: false
        default: "claude-release"
      backup_password:
        description: "Password buat encrypt artifact backup (min 12 char, INGAT!)"
        required: true
      force_regenerate:
        description: "Timpa keystore lama? (ketik YES persis)"
        required: false
        default: "no"

jobs:
  generate:
    name: Generate keystore + set secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — refuse if keystore secret sudah ada (kecuali force)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FORCE: ${{ inputs.force_regenerate }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret GH_PAT belum di-set. Baca komentar di file workflow ini."
            exit 1
          fi
          EXIST=$(gh secret list --repo "$GITHUB_REPOSITORY" \
                    --json name -q '.[].name' | grep -c '^ANDROID_KEYSTORE_BASE64$' || true)
          if [ "$EXIST" -gt 0 ] && [ "$FORCE" != "YES" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 sudah ada. Kalau beneran mau regenerate (WARNING: SHA-1 lama akan mati, semua Google Sign-in existing rusak), re-run workflow dengan input force_regenerate=YES."
            exit 1
          fi

      - name: Setup Java (Temurin 17 — buat keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore + fingerprints
        id: gen
        env:
          KEY_ALIAS: ${{ inputs.key_alias }}
        run: |
          set -euo pipefail
          mkdir -p build/keystore
          cd build/keystore

          # M18 — SINGLE password (store == key). PKCS12 spec technically
          # mandates store == key untuk banyak tool path, dan pattern ini
          # menghilangkan seluruh kelas error "Given final block not properly
          # padded" yang muncul kalau salah satu dari 2 secret ke-truncate /
          # ke-mangle di CI. Owner cuma perlu mikirin 1 password.
          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS="$STORE_PASS"

          # M18 — Explicit -storetype PKCS12 (default modern keytool, tapi
          # eksplisit biar deterministik antara CI runner & lokal).
          keytool -genkeypair -v \
            -keystore claude-release.jks \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 36500 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Claude AI, OU=Mobile, O=ClaudeMemek, L=Jakarta, ST=DKI, C=ID"

          # M18 — Self-test: langsung buka keystore dengan password yg dipake
          # buat generate. Kalau step ini gagal, jangan lanjut set secret
          # (mencegah repeat bug padding di build workflow).
          keytool -list -keystore claude-release.jks -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > /dev/null
          echo "✅ Self-test keystore lolos (password match, alias exists)."

          # Base64 single-line (GitHub Secret friendly). `-w0` = no line wrap
          # → gak ada whitespace tersembunyi yg bisa bikin decode gagal.
          base64 -w0 claude-release.jks > claude-release.jks.base64

          # Fingerprints
          keytool -list -v -keystore claude-release.jks -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" > fingerprints.raw
          SHA1=$(grep 'SHA1:'   fingerprints.raw | head -1 | awk '{print $2}')
          SHA256=$(grep 'SHA256:' fingerprints.raw | head -1 | awk '{print $2}')
          SHA256_HEX_NOCOLON=$(echo "$SHA256" | tr -d ':' | tr 'a-z' 'A-Z')

          # Simpan buat step berikutnya (mask password!)
          echo "::add-mask::$STORE_PASS"
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS"     >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1"             >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256"         >> "$GITHUB_OUTPUT"
          echo "sha256_hex=$SHA256_HEX_NOCOLON" >> "$GITHUB_OUTPUT"

          # SECRETS.txt buat manual fallback (kalau auto-set gagal)
          cat > SECRETS.txt <<EOF
          ================================================================
          COPY EACH LINE AS A SEPARATE GITHUB SECRET (kalau auto-set gagal)
          Repo → Settings → Secrets and variables → Actions → New secret
          ================================================================

          ANDROID_KEYSTORE_BASE64
          $(cat claude-release.jks.base64)

          ANDROID_KEYSTORE_PASSWORD
          $STORE_PASS

          ANDROID_KEY_ALIAS
          $KEY_ALIAS

          ANDROID_KEY_PASSWORD
          $KEY_PASS
          EOF

          cat > FINGERPRINTS.txt <<EOF
          Firebase Console → Project settings → Your apps → Add fingerprint
          Package: com.claudememek.app

          SHA-1   : $SHA1
          SHA-256 : $SHA256

          EXPECTED_SIG_SHA256 (buat native anti-tamper M11, hex tanpa colon):
          $SHA256_HEX_NOCOLON
          EOF

      - name: Set GitHub Secrets automatically (via PAT)
        env:
          GH_TOKEN:   ${{ secrets.GH_PAT }}
          B64_FILE:   build/keystore/claude-release.jks.base64
          STORE_PASS: ${{ steps.gen.outputs.store_pass }}
          KEY_PASS:   ${{ steps.gen.outputs.key_pass }}
          KEY_ALIAS:  ${{ inputs.key_alias }}
          SHA256_HEX: ${{ steps.gen.outputs.sha256_hex }}
        run: |
          set -e
          REPO="$GITHUB_REPOSITORY"
          gh secret set ANDROID_KEYSTORE_BASE64  --repo "$REPO" < "$B64_FILE"
          printf '%s' "$STORE_PASS" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$REPO"
          printf '%s' "$KEY_ALIAS"  | gh secret set ANDROID_KEY_ALIAS         --repo "$REPO"
          printf '%s' "$KEY_PASS"   | gh secret set ANDROID_KEY_PASSWORD      --repo "$REPO"
          printf '%s' "$SHA256_HEX" | gh secret set EXPECTED_SIG_SHA256       --repo "$REPO"
          echo "5 secrets set: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, EXPECTED_SIG_SHA256"

      - name: Package encrypted backup (7z, password = your input)
        env:
          BACKUP_PASS: ${{ inputs.backup_password }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          cd build/keystore
          7z a -p"$BACKUP_PASS" -mhe=on claude-keystore-backup.7z \
            claude-release.jks claude-release.jks.base64 SECRETS.txt FINGERPRINTS.txt
          ls -la claude-keystore-backup.7z

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-keystore-backup-ENCRYPTED
          path: build/keystore/claude-keystore-backup.7z
          retention-days: 90

      - name: Write Job Summary (SHA-1 + next steps)
        env:
          SHA1:       ${{ steps.gen.outputs.sha1 }}
          SHA256:     ${{ steps.gen.outputs.sha256 }}
          SHA256_HEX: ${{ steps.gen.outputs.sha256_hex }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Keystore Generated — Permanent

          ## Fingerprints (daftar ke Firebase Console SEKARANG)

          - **SHA-1**: \`$SHA1\`
          - **SHA-256**: \`$SHA256\`

          Firebase Console → Project settings → Your apps (com.claudememek.app)
          → Add fingerprint → paste keduanya → **Download google-services.json baru**
          → replace \`android/app/google-services.json\` → commit & push.

          ## EXPECTED_SIG_SHA256 (native anti-tamper M11)

          Hex tanpa colon: \`$SHA256_HEX\`
          Sudah otomatis di-set sebagai secret \`EXPECTED_SIG_SHA256\`.

          ## Secrets yang sudah di-set otomatis

          - ANDROID_KEYSTORE_BASE64
          - ANDROID_KEYSTORE_PASSWORD
          - ANDROID_KEY_ALIAS
          - ANDROID_KEY_PASSWORD
          - EXPECTED_SIG_SHA256

          ## Backup wajib

          Download artifact \`claude-keystore-backup-ENCRYPTED\` (7z, di-encrypt
          pake password yang lo input tadi). Simpan di Google Drive / password
          manager. **Kalau file .jks ini hilang, semua user Google Sign-in
          langsung mati total dan nggak bisa recover.**

          ## Setelah ini

          1. Selesai daftar SHA-1/SHA-256 di Firebase → download
             google-services.json baru → commit ke \`android/app/\`.
          2. Push. Workflow \`Android Build\` otomatis pakai keystore permanen.
          3. **Hapus workflow \`generate-keystore.yml\`** biar nggak ke-trigger
             ulang tanpa sengaja (atau biarin, ada guard \`refuse-if-exists\`).
          EOF
          
